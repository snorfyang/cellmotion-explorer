<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Knowledge base · CellMotion Explorer</title><style>:root{--ink:#0f172a;--muted:#64748b;--blue:#1d4ed8;--line:#dbe4ee;--bg:#f8fafc}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 Inter,system-ui,sans-serif}main{max-width:980px;margin:0 auto;padding:34px 20px 60px}.back{color:var(--blue);font-weight:700;text-decoration:none}.hero{margin:36px 0 22px}.kicker{color:var(--blue);font-size:11px;letter-spacing:.14em;font-weight:700}.hero h1{font:600 44px/1.05 Georgia,serif;margin:8px 0}.hero p{color:var(--muted);max-width:66ch}.panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px;margin:14px 0;box-shadow:0 10px 24px rgba(15,23,42,.05)}.kb-editor{display:grid;gap:12px}.kb-entry{border:1px solid var(--line);border-radius:10px;padding:14px;background:#f8fafc}.kb-entry-grid{display:grid;grid-template-columns:minmax(170px,.7fr) minmax(0,1.5fr);gap:10px}.kb-entry label{display:block;color:var(--muted);font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px}.kb-entry input,.kb-entry textarea{width:100%;border:1px solid #cbd5e1;border-radius:7px;background:#fff;color:var(--ink);padding:9px;font:13px/1.45 Inter,system-ui,sans-serif}.kb-entry textarea{min-height:62px;resize:vertical}.kb-sources{margin-top:10px}.kb-remove{float:right;border:0;background:transparent;color:#c2415a;font-size:11px;cursor:pointer}.actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px}.actions button{border:1px solid #bfdbfe;border-radius:8px;padding:9px 12px;font-weight:700;cursor:pointer}.add{background:#eff6ff;color:var(--blue)}.save{background:var(--blue);color:#fff;border-color:var(--blue)!important}.version-info{color:#1d4ed8;font-size:12px;font-weight:700;margin-bottom:10px}.snapshot-links{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.snapshot-links a{color:#64748b;font-size:11px}.status{color:#15803d;font-size:12px}@media(max-width:700px){main{padding:24px 14px 46px}.hero h1{font-size:36px}.kb-entry-grid{grid-template-columns:1fr}}</style></head><body><main><a class="back" href="index.html">← Back to CellMotion Explorer</a><section class="hero"><span class="kicker">LOCAL EVIDENCE</span><h1>Knowledge base</h1><p>Maintain the evidence rules that SciencePal checks before interpreting motion. Changes are saved to the local project and uploaded automatically with the next run.</p></section><section class="panel"><div id="versionInfo" class="version-info">Current version loading…</div><div id="snapshotLinks" class="snapshot-links"></div><div id="kbEditor" class="kb-editor"></div><div class="actions"><button class="add" id="kbAdd" type="button">+ Add entry</button><button class="save" id="kbSave" type="button">Save knowledge base</button><span class="status" id="status" role="status"></span></div></section></main><script>const API='http://127.0.0.1:8780/api/knowledge';let rows=[],persisted=[];const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function render(){document.getElementById('kbEditor').innerHTML=rows.map((r,i)=>`<article class="kb-entry"><button class="kb-remove" type="button" data-remove="${i}">Delete entry</button><div class="kb-entry-grid"><div><label>Topic</label><input data-field="topic" value="${esc(r.topic||'')}" placeholder="e.g. Dataset scope"></div><div><label>Claim</label><textarea data-field="claim" placeholder="Evidence rule or boundary">${esc(r.claim||'')}</textarea></div></div><div class="kb-sources"><label>Sources · one per line</label><textarea data-field="sources" placeholder="file.json&#10;paper.md">${esc((r.sources||[]).join('\n'))}</textarea></div><input type="hidden" data-field="id" value="${esc(r.id||'')}"></article>`).join('')||'<p>No entries yet. Add the first evidence rule.</p>'}async function load(){try{const requested=new URLSearchParams(location.search).get('version');const d=await (await fetch(requested?API+'/versions/'+encodeURIComponent(requested):API)).json();if(!d.ok)throw Error();rows=d.knowledge||d.entries||[];persisted=rows.map(x=>x.id);render();const info=document.getElementById('versionInfo');if(info)info.textContent=requested?`Viewing immutable snapshot ${d.version}`:`Current knowledge base: ${d.version}`;if(requested){document.querySelectorAll('input,textarea,#kbAdd,#kbSave').forEach(x=>x.disabled=true);document.querySelectorAll('.kb-remove').forEach(x=>x.hidden=true);document.getElementById('status').textContent='Read-only snapshot'}else{const versions=await (await fetch(API)).json();document.getElementById('snapshotLinks').innerHTML=(versions.versions||[]).slice().reverse().map(v=>`<a href="knowledge.html?version=${encodeURIComponent(v.version)}">View ${v.version} · ${new Date(v.saved_at).toLocaleString()}</a>`).join(' · ')}}catch(e){document.getElementById('status').textContent='Local proxy unavailable'}}function collect(){return [...document.querySelectorAll('.kb-entry')].map(card=>{const g=n=>card.querySelector(`[data-field="${n}"]`);return{id:g('id').value,topic:g('topic').value.trim(),claim:g('claim').value.trim(),sources:g('sources').value.split('\n').map(x=>x.trim()).filter(Boolean)}})}async function save(){const s=document.getElementById('status'),next=collect();if(next.some(x=>!x.topic||!x.claim)){s.textContent='Topic and claim are required';return}s.textContent='Saving…';try{const res=await fetch(API,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({knowledge:next})});const data=await res.json();if(!res.ok||!data.ok)throw Error();await load();s.textContent=`Saved as ${data.version} · next SciencePal run will use this snapshot`;setTimeout(()=>s.textContent='',5000)}catch(e){s.textContent='Save failed · check the local proxy'}}document.addEventListener('click',e=>{const b=e.target.closest('[data-remove]');if(b){rows.splice(Number(b.dataset.remove),1);render()}});document.getElementById('kbAdd').onclick=()=>{rows.push({id:'',topic:'',claim:'',sources:[]});render();document.querySelector('.kb-entry:last-child input').focus()};document.getElementById('kbSave').onclick=save;load();</script></body></html>
